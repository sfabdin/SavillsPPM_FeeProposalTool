<style>
.head .title-block h1 a{color:inherit;text-decoration:none}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.kpi-card{background:#fff;border:1px solid rgba(37,39,58,.10);padding:16px 18px}
.kpi-card .k-num{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1;color:var(--sav-navy)}
.kpi-card .k-lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#79828C;margin-top:8px}
.kpi-card.accent .k-num{color:var(--sav-teal)}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.toolbar input[type=search]{font-family:var(--font-body);font-size:13px;padding:8px 12px;border:1px solid rgba(37,39,58,.22);min-width:230px}
.toolbar select{font-family:var(--font-body);font-size:12.5px;padding:7px 10px;border:1px solid rgba(37,39,58,.22);background:#fff;color:var(--sav-navy)}
.toolbar .grow{flex:1}
.scope-note{font-size:11.5px;color:#79828C;margin:0 0 22px}
.scope-note b{color:var(--sav-navy)}
.daygrp{margin-bottom:26px}
.dayhead{display:flex;align-items:baseline;gap:12px;padding:0 0 8px;border-bottom:2px solid var(--sav-navy);margin-bottom:0}
.dayhead h2{font-family:var(--font-display);font-weight:800;font-size:16px;margin:0;color:var(--sav-navy)}
.dayhead .dcount{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#79828C}
.ent{display:grid;grid-template-columns:64px 150px 1fr;gap:16px;padding:13px 4px;border-bottom:1px solid rgba(37,39,58,.08);background:#fff}

.e-time{font-family:var(--font-display);font-size:12px;color:#79828C;padding-top:2px}
.e-who{font-size:12.5px;color:var(--sav-navy);padding-top:1px;line-height:1.35}
.e-who b{font-family:var(--font-display);font-weight:700;display:block}
.e-who span{font-size:10.5px;color:#79828C}
.e-main{min-width:0}
.e-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.badge{font-family:var(--font-display);font-weight:700;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;color:#fff;background:#79828C;white-space:nowrap}
.badge.create{background:var(--sav-teal)}
.badge.edit{background:#5B6474}
.badge.status{background:#E0A800;color:var(--sav-navy)}
.badge.book{background:#1f7a44}
.badge.delete{background:#C0392B}
.badge.restore{background:#1f7a44}
.badge.ledger{background:#1D6B78}
.badge.system{background:#5B3A8C}
.badge.staff{background:#B25C00}
.e-proj{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--sav-navy);text-decoration:none}
.e-proj:hover{text-decoration:underline}
.e-client{font-size:11.5px;color:#79828C}
.e-line{font-size:12.5px;color:var(--sav-navy);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:11.5px;background:#F3F2EF;border:1px solid rgba(37,39,58,.10);padding:3px 9px;color:var(--sav-navy);line-height:1.5}
.chip b{font-family:var(--font-display);font-weight:700}
.chip .arw{color:#A7ADB5;margin:0 3px}
.chip.fee{background:#FFF9E0;border-color:rgba(224,168,0,.35)}
.chip.fee.up b{color:#1f7a44}
.chip.fee.down b{color:#C0392B}
.chip.detail{background:transparent;border:0;padding:3px 0;color:#79828C}
.empty{padding:48px 24px;text-align:center;background:#fff;border:1px solid rgba(37,39,58,.10)}
.empty h3{font-family:var(--font-display);font-weight:800;font-size:17px;margin:0 0 8px;color:var(--sav-navy)}
.empty p{font-size:13px;color:#79828C;margin:0 auto;max-width:56ch;line-height:1.6}
.more{margin-top:6px}
.loading{font-size:11.5px;color:var(--sav-teal);font-style:italic}
.recover{margin:0 0 14px;font-size:12px;color:#79828C}
.recover summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px}
.recover summary::-webkit-details-marker{display:none}
.recover summary .tag{font-family:var(--font-display);font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8a6d00;background:#fdf3d7;padding:2px 7px}
.recover summary:hover .tag{background:#f7e7ad}
.recover .body{margin:8px 0 0;padding:10px 14px;background:#FFF9E0;border-left:3px solid #E0A800;max-width:82ch;line-height:1.5;color:var(--sav-navy)}
.recover .btn{margin-right:8px;margin-top:6px}
.recover .out{display:block;margin-top:6px;color:#79828C}
@media print{.toolbar,.identity-bar{display:none!important}}
</style>

<body>
<div class="wrap">

  <header class="head">
    <img class="logo" src="design-system/assets/savills_logo.png" alt="Savills">
    <div class="title-block">
      <h1><a href="Fee Generator.html">Change Log</a></h1>
      <p class="tagline">Who changed what, and when — every create, edit, status change and deletion across the system.</p>
    </div>
  </header>

  <div class="identity-bar">
    <span class="id-label">Viewing as</span>
    <select id="id-user"></select>
    <span class="id-role" id="id-role"></span>
    <span class="id-note" id="id-note"></span>
  </div>

  <div class="kpi-strip" id="kpis"></div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Filter by project, client or person…">
    <select id="f-who"></select>
    <select id="f-action">
      <option value="">All actions</option>
      <option value="create">Created</option>
      <option value="edit">Edited</option>
      <option value="status">Status changed</option>
      <option value="book">Booked / approved</option>
      <option value="ledger">Reconciliation</option>
      <option value="staff">Staffing</option>
      <option value="system">Admin &amp; system</option>
      <option value="delete">Deleted</option>
    </select>
    <select id="f-range">
      <option value="7">Last 7 days</option>
      <option value="30" selected>Last 30 days</option>
      <option value="90">Last 90 days</option>
      <option value="365">Last 12 months</option>
      <option value="">All time</option>
    </select>
    <span class="loading" id="loading" hidden>loading months…</span>
    <span class="grow"></span>
    <button class="btn" id="csv">⤓ CSV</button>
    <button class="btn btn-primary" onclick="window.print()">Print / PDF</button>
  </div>

  <p class="scope-note" id="scope-note"></p>
  <details class="recover" id="recover" hidden></details>

  <div id="feed"></div>

</div>

<script>window.UFC_NEEDS = ['activity'];</script>
<script src="universal-fee-calc/rates-catalog.js"></script>
<script src="universal-fee-calc/store.js"></script>
<script src="universal-fee-calc/box-adapter.js"></script>
<script src="universal-fee-calc/boot.js"></script>
<script src="universal-fee-calc/ui.js"></script>
<script src="universal-fee-calc/sync-status.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const STORE = window.UFC_Store;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const money = (n) => '$' + Math.abs(Math.round(n)).toLocaleString();

  /* Every action the trail can carry. One the page has never heard of still
     renders, under its own raw name — a trail that silently hides entries it
     does not recognise is worse than one that shows an odd word. */
  const ACTION_LABEL = {
    create: 'Created', edit: 'Edited', status: 'Status', book: 'Booked',
    delete: 'Deleted', restore: 'Restored', purge: 'Purged',
    'co-create': 'Change order', 'co-approve': 'CO approved',
    'reconcile-commit': 'Reconciled to actuals',
    'plan-adjust': 'Plan adjusted', 'schedule-shift': 'Schedule shifted',
    slip: 'Slipped', 'slip-remove': 'Slip removed',
    'ledger-post': 'Actuals posted', 'ledger-remove': 'Actuals removed',
    'ledger-status': 'Billing status', 'ledger-amount': 'Figure corrected',
    'ledger-allocate': 'Allocation', 'ledger-allocate-auto': 'Allocation (auto)',
    'ledger-accrue-earned': 'Accrued as earned', 'ledger-spread': 'Accrual spread',
    'ledger-note': 'Commentary', 'ledger-map': 'Mapped', 'ledger-match': 'Mapped',
    'ledger-map-ignore': 'Ruled out of scope', 'ledger-map-restore': 'Back in scope',
    'ledger-automap': 'Auto-mapped', 'project-from-ledger': 'Created from a ledger line',
    'ledger-migrate': 'Ledger moved to its own store',
    maintenance: 'Maintenance mode', vocab: 'Lists changed', import: 'Bulk import',
    'baseline-save': 'Baseline saved', 'baseline-delete': 'Baseline deleted',
    'scenario-save': 'Scenario saved', 'scenario-delete': 'Scenario deleted',
    'activity-migrate': 'Trail moved to its own store',
    'staff-alloc-add': 'Staffed', 'staff-alloc': 'Staffing changed', 'staff-alloc-remove': 'Unstaffed',
    'staff-person-add': 'Person added', 'staff-person': 'Roster changed', 'staff-hours': 'Month hours',
    'staff-import': 'Matrix imported', 'staff-reseed': 'Matrix re-seeded', 'staff-reset': 'Matrix reset',
    'staff-actuals': 'Hours imported', 'staff-actuals-clear': 'Hours cleared',
    'staff-titles': 'Titles filled', 'staff-rename': 'Projects renamed',
    'staff-map': 'Mapping', 'staff-gap-dismiss': 'Gap dismissed', 'staff-gap-restore': 'Gap restored',
  };
  /* Which badge an action wears. Grouped by what the action DOES, not by which
     module raised it — a reader cares that money moved, not that it moved in
     the ledger rather than the calculator. */
  const ACTION_KIND = (a) =>
    /^(create|co-create|project-from-ledger|restore)$/.test(a) ? 'create'
    : /^(delete|purge|ledger-remove|baseline-delete|scenario-delete)$/.test(a) ? 'delete'
    : /^(book|co-approve)$/.test(a) ? 'book'
    : /^(status|slip|slip-remove)$/.test(a) ? 'status'
    : /^(maintenance|vocab|import|activity-migrate|ledger-migrate)$/.test(a) ? 'system'
    : /^staff-/.test(a) ? 'staff'
    : /^(ledger-|plan-adjust$|schedule-shift$|reconcile-commit$)/.test(a) ? 'ledger'
    : 'edit';
  let search = '', who = '', action = '', rangeDays = 30, limit = 200;
  let remoteMonths = null, loading = false;

  /* Entries are scoped to the projects you're allowed to see. Admins see
     everything, including entries for projects that were since deleted. */
  /* Read once per render. The trail is uncapped now, so walking it four times
     to draw one page is the difference between instant and noticeable once a
     few years have accumulated. */
  let _scoped = null;
  function scopedEntries() {
    if (_scoped) return _scoped;
    const all = STORE.listActivity ? STORE.listActivity(null) : [];
    const admin = STORE.seesAllProjects(STORE.getCurrentUser());
    if (admin) return (_scoped = all);
    const visible = new Set(STORE.visibleProjects(STORE.listProjects()).map(p => p.id));
    return (_scoped = all.filter(e => e.projectId && visible.has(e.projectId)));
  }

  function projName(e) {
    const m = e.meta || {};
    if (m.name) return m.name;
    if (m.project) return m.project;          // staffing lines carry their project as free text
    const p = e.projectId ? STORE.getProject(e.projectId) : null;
    if (p && p.project && p.project.name) return p.project.name;
    /* An entry with no project is not a broken link — a mapping change, a
       matrix import, maintenance mode genuinely have no project behind them.
       Saying "(project removed)" for those reads as data loss. */
    return e.projectId ? '(project removed)' : '—';
  }
  function projClient(e) {
    const m = e.meta || {};
    if (m.client) return m.client;
    const p = e.projectId ? STORE.getProject(e.projectId) : null;
    return (p && p.project && p.project.client) || '';
  }
  function statusLabel(s) {
    return (STORE.STATUS_LABELS && STORE.STATUS_LABELS[s]) || s || '—';
  }
  const dayLabel = (ts) => ts ? new Date(ts).toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }) : '—';
  const monthLabel = (m) => m ? (MON[+String(m).slice(5, 7) - 1] + ' ' + String(m).slice(0, 4)) : '—';

  /* ---- Which months this page needs loaded -------------------------------
     One file per month is what makes the trail affordable, and it is also what
     makes "last 7 days" cheap when the trail runs back years: the page works
     out the months its window touches and fetches only those. Widening the
     range fetches the difference, never the whole thing again. ---- */
  function monthsForRange(days) {
    const out = [];
    if (!days) return remoteMonths ? remoteMonths.slice() : out;      // all time
    const now = new Date();
    const first = new Date(now.getTime() - days * 86400000);
    const d = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth(), 1));
    while (d <= now) { out.push(d.toISOString().slice(0, 7)); d.setUTCMonth(d.getUTCMonth() + 1); }
    return out;
  }
  async function ensureMonthsLoaded() {
    const Box = window.UFC_Box;
    if (!Box || !Box.enabled || !Box.pullActivityMonths) return false;
    if (loading) return false;
    if (!remoteMonths && Box.listActivityMonths) {
      try { remoteMonths = await Box.listActivityMonths(); } catch (e) { remoteMonths = []; }
    }
    const have = new Set(STORE.activityMonths());
    const want = monthsForRange(rangeDays)
      .filter(m => !have.has(m) && (!remoteMonths || remoteMonths.includes(m)));
    if (!want.length) return false;
    loading = true; $('#loading').hidden = false;
    try { await Box.pullActivityMonths(want); }
    finally { loading = false; $('#loading').hidden = true; }
    return true;
  }

  /* ---- Recovering what the old cap threw away ---- */
  function renderRecover(admin, cov) {
    const el = $('#recover');
    const Box = window.UFC_Box;
    if (!el) return;
    if (!admin || !Box || !Box.enabled || !Box.backfillActivityFromBackups) { el.hidden = true; return; }
    if (el.dataset.done) return;                       // leave the result on screen
    el.hidden = false;
    /* One quiet line, folded. The explanation and the button live inside. */
    el.innerHTML = '<summary><span class="tag">Admin</span>Recover older history from the weekly backups…</summary>'
      + '<div class="body">Before the trail had its own store it was capped, so older entries were discarded on sync. '
      + 'Each weekly Box backup holds roughly the two days before it; a sweep recovers those. Safe to repeat — entries merge by id.'
      + '<br><button class="btn" id="do-recover">Sweep the weekly backups</button>'
      + '<span class="out" id="recover-out"></span></div>';
    $('#do-recover').addEventListener('click', async () => {
      const btn = $('#do-recover'), out = $('#recover-out');
      btn.disabled = true;
      out.textContent = 'Reading the backups…';
      try {
        const r = await Box.backfillActivityFromBackups((p) => {
          out.textContent = `Read ${p.scanned} of ${p.total} backups (${p.at}) — ${p.added} entries recovered so far…`;
        });
        el.dataset.done = '1';
        out.innerHTML = r.added
          ? `Recovered <b>${r.added}</b> entries from ${r.scanned} weekly backups. Reload to see them in the feed.`
          : `Swept ${r.scanned} backups — nothing to recover that the trail did not already hold.`;
        remoteMonths = null;
        render();
      } catch (e) {
        out.textContent = 'Could not read the backups: ' + e.message;
        btn.disabled = false;
      }
    });
  }

  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  /** "January 2026" out of a stored "2026-01", or a bare month number. */
  function ymLabel(v, year) {
    if (v == null || v === '') return '—';
    const s2 = String(v);
    const m = /^(\d{4})-(\d{1,2})$/.exec(s2);
    if (m) return MON[+m[2] - 1] + ' ' + m[1];
    const n = +s2;
    return (n >= 1 && n <= 12) ? MON[n - 1] + (year ? ' ' + year : '') : esc(s2);
  }
  const m$ = (n) => (n == null ? '—' : (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString());

  function headline(e) {
    const m = e.meta || {};
    const a = e.action;
    if (a === 'create') return 'Created this project' + (m.status ? ' as <b>' + esc(statusLabel(m.status)) + '</b>' : '');
    if (a === 'delete') return 'Deleted this project';
    if (a === 'restore') return 'Restored this project';
    if (a === 'purge') return 'Purged the deleted record for good';
    if (a === 'book') return 'Booked — status <b>' + esc(statusLabel(m.from)) + '</b> → <b>' + esc(statusLabel(m.to)) + '</b>';
    if (a === 'status') return 'Status <b>' + esc(statusLabel(m.from)) + '</b> → <b>' + esc(statusLabel(m.to)) + '</b>';
    if (a === 'co-create') return 'Raised a change order against this contract';
    if (a === 'co-approve') return 'Approved the change order — it now counts in the revised contract';
    if (a === 'reconcile-commit') return 'Committed the staffing to match imported actuals';

    /* The reconciliation actions. Each one says the DECISION, with the figures
       either side of it, because "someone touched March" is not an audit. */
    if (a === 'ledger-status') return 'Billing status for <b>' + ymLabel(m.month, m.year) + '</b> — '
      + esc(m.from || 'no status') + ' → <b>' + esc(m.to || 'cleared') + '</b>'
      + (m.billsIn ? ', invoice due <b>' + ymLabel(m.billsIn, m.year) + '</b>' : '')
      + (m.carryTo ? ', moved to <b>' + ymLabel(m.carryTo, m.year) + '</b>' : '');
    if (a === 'ledger-amount') return esc(m.field || 'Figure') + ' for <b>' + ymLabel(m.month, m.year) + '</b> — '
      + m$(m.from) + ' → <b>' + m$(m.to) + '</b>';
    if (a === 'ledger-allocate') return m.cleared
      ? 'Cleared the allocation for <b>' + ymLabel(m.month, m.year) + '</b>'
      : '<b>' + m$(m.amount) + '</b> earned in ' + ymLabel(m.month, m.year)
        + ' — accrues <b>' + ymLabel(m.accrue) + '</b>, bills <b>' + ymLabel(m.bill) + '</b>, realized <b>' + ymLabel(m.realize) + '</b>';
    if (a === 'ledger-allocate-auto') return 'Auto-allocated <b>' + (m.months || 0) + ' earned month'
      + ((m.months === 1) ? '' : 's') + '</b> in ' + esc(m.year || '');
    if (a === 'ledger-accrue-earned') return 'Accrued <b>' + (m.months || 0) + ' earned month'
      + ((m.months === 1) ? '' : 's') + '</b> in ' + esc(m.year || '');
    if (a === 'ledger-spread') return 'Spread <b>' + m$(m.amount) + '</b> of accrual across '
      + ymLabel(m.fromMonth, m.year) + '–' + ymLabel(m.toMonth, m.year) + ' (' + m$(m.each) + ' each)';
    if (a === 'ledger-note') return m.to
      ? 'Commentary on ' + ymLabel(m.month, m.year) + ': “' + esc(m.to) + '”'
      : 'Cleared the commentary on ' + ymLabel(m.month, m.year);
    if (a === 'ledger-post') return 'Posted <b>' + esc(m.year || '') + '</b> actuals through <b>'
      + ymLabel(m.closeMonth, m.year) + '</b> — ' + (m.rows || 0) + ' lines'
      + (m.file ? ' from ' + esc(m.file) : '');
    if (a === 'ledger-remove') return 'Removed all <b>' + esc(m.year || '') + '</b> actuals';
    if (a === 'ledger-map' || a === 'ledger-match') return 'Mapped the close-file line <b>' + esc(m.key || m.name || '') + '</b> to this project';
    if (a === 'ledger-map-ignore') return 'Ruled <b>' + esc(m.key || '') + '</b> out of scope — ' + esc(m.reason || '');
    if (a === 'ledger-map-restore') return 'Put <b>' + esc(m.key || '') + '</b> back in the mapping queue';
    if (a === 'ledger-automap') return 'Auto-mapped <b>' + (m.applied || 0) + '</b> of ' + (m.considered || 0) + ' unmapped lines';
    if (a === 'project-from-ledger') return 'Created this project from a line in the ' + esc(m.year || '') + ' close file';
    if (a === 'maintenance') return 'Maintenance mode <b>' + esc(m.to || '') + '</b>' + (m.note ? ' — ' + esc(m.note) : '');
    if (a === 'vocab') return 'Added <b>' + (m.added || 0) + '</b> entr' + ((m.added === 1) ? 'y' : 'ies') + ' to the system lists';
    if (a === 'import') return 'Bulk <b>' + esc(m.mode || '') + '</b> import of <b>' + (m.projects || 0) + '</b> projects'
      + (m.replaced ? ' over ' + m.replaced + ' existing' : '');
    if (a === 'activity-migrate') return 'Moved <b>' + (m.entries || 0) + '</b> trail entries into the audit store';

    /* The staffing matrix. "Who moved Jane off Tower Alpha in March" is the
       question this store gets asked, so the person and the project lead. */
    const span = (x) => (x.start || x.end) ? ' (' + esc(x.start || '?') + ' → ' + esc(x.end || 'open') + ')' : '';
    if (a === 'staff-alloc-add') return '<b>' + esc(m.person || '') + '</b> staffed to <b>' + esc(m.project || '') + '</b>'
      + (m.pct != null ? ' at <b>' + m.pct + '%</b>' : '') + span(m);
    if (a === 'staff-alloc') return 'Staffing for <b>' + esc(m.person || '') + '</b> on <b>' + esc(m.project || '') + '</b> changed';
    if (a === 'staff-alloc-remove') return '<b>' + esc(m.person || '') + '</b> taken off <b>' + esc(m.project || '') + '</b>'
      + (m.pct != null ? ' (was ' + m.pct + '%)' : '') + span(m);
    if (a === 'staff-person-add') return 'Added <b>' + esc(m.person || '') + '</b> to the roster';
    if (a === 'staff-person') return 'Roster entry for <b>' + esc(m.person || '') + '</b> changed';
    if (a === 'staff-hours') return 'Hours in a month <b>' + esc(String(m.from)) + '</b> → <b>' + esc(String(m.to))
      + '</b> — every expected-hours, burn and compliance figure moves with this';
    if (a === 'staff-import') return 'Imported the staffing matrix from <b>' + esc(m.source || 'a file') + '</b> — '
      + (m.people || 0) + ' people, ' + (m.allocations || 0) + ' allocations, replacing ' + (m.replacedAllocations || 0);
    if (a === 'staff-reseed') return 'Re-seeded the matrix — ' + (m.allocations || 0) + ' allocations, replacing ' + (m.replacedAllocations || 0);
    if (a === 'staff-reset') return 'Reset the whole matrix — replaced ' + (m.replacedAllocations || 0) + ' allocations';
    if (a === 'staff-actuals') return 'Imported Clockify hours (<b>' + esc(m.mode || '') + '</b>) for ' + esc(m.months || '')
      + ' — ' + (m.written || 0) + ' cells written' + (m.skipped ? ', ' + m.skipped + ' unmatched' : '');
    if (a === 'staff-actuals-clear') return 'Cleared <b>' + (m.cleared || 0) + '</b> cells of imported hours';
    if (a === 'staff-titles') return 'Filled <b>' + (m.titles || 0) + '</b> blank roster titles from Clockify';
    if (a === 'staff-rename') return 'Renamed projects across <b>' + (m.rows || 0) + '</b> allocations — ' + esc(m.pairs || '');
    if (a === 'staff-map') return 'Mapping (' + esc(m.kind || '') + ') for <b>' + esc(m.key || '') + '</b> — '
      + (m.from ? esc(String(m.from)) + ' → ' : '') + '<b>' + esc(m.to == null ? 'cleared' : String(m.to)) + '</b>';
    if (a === 'staff-gap-dismiss') return 'Dismissed a contract staffing gap — ' + esc(m.reason || '');
    if (a === 'staff-gap-restore') return 'Put a dismissed staffing gap back on the list';

    const n = (m.changes || []).length;
    return n ? ('Changed ' + n + ' field' + (n === 1 ? '' : 's')) : 'Saved changes';
  }

  function chips(e) {
    const m = e.meta || {};
    const out = [];
    if (m.fee) {
      const up = m.fee.delta > 0;
      out.push('<span class="chip fee ' + (up ? 'up' : 'down') + '">Net fee <b>' + (up ? '+' : '−') + money(m.fee.delta) + '</b>'
        + '<span class="arw">·</span>' + money(m.fee.from) + '<span class="arw">→</span>' + money(m.fee.to) + '</span>');
    }
    (m.changes || []).forEach(c => {
      if (c.field === 'Team') {
        out.push('<span class="chip"><b>Team</b> ' + esc(c.from) + '<span class="arw">→</span>' + esc(c.to) + '</span>');
        if (c.detail) out.push('<span class="chip detail">' + esc(c.detail) + '</span>');
      } else {
        out.push('<span class="chip"><b>' + esc(c.field) + '</b> ' + esc(c.from) + '<span class="arw">→</span>' + esc(c.to) + '</span>');
      }
    });
    return out.length ? '<div class="chips">' + out.join('') + '</div>' : '';
  }

  function filtered() {
    let rows = scopedEntries();
    if (rangeDays) {
      const cut = Date.now() - rangeDays * 86400000;
      rows = rows.filter(e => new Date(e.ts).getTime() >= cut);
    }
    if (action) rows = rows.filter(e => ACTION_KIND(e.action) === action);
    if (who) rows = rows.filter(e => (e.actor || '') === who);
    if (search) {
      const q = search.toLowerCase();
      rows = rows.filter(e => (projName(e) + ' ' + projClient(e) + ' ' + (e.actorName || '') + ' ' + (e.actor || '')).toLowerCase().includes(q));
    }
    return rows;
  }

  function buildWhoFilter(rows) {
    const sel = $('#f-who');
    const seen = {};
    scopedEntries().forEach(e => { if (e.actor) seen[e.actor] = e.actorName || e.actor; });
    const opts = ['<option value="">Everyone</option>']
      .concat(Object.keys(seen).sort((a, b) => seen[a].localeCompare(seen[b]))
        .map(k => '<option value="' + esc(k) + '">' + esc(seen[k]) + '</option>'));
    sel.innerHTML = opts.join('');
    sel.value = who;
  }

  function buildIdentityBar() {
    const sel = $('#id-user');
    const label = document.querySelector('.identity-bar .id-label');
    const cur = STORE.getCurrentUser();
    if (!STORE.canImpersonate()) {
      if (sel) sel.style.display = 'none';
      if (label) label.textContent = 'Signed in as';
      let nameEl = document.getElementById('id-static-name');
      if (!nameEl && sel) {
        nameEl = document.createElement('span');
        nameEl.id = 'id-static-name';
        nameEl.style.cssText = 'font-family:var(--font-display);font-weight:700;font-size:13px;color:#fff;margin:0 4px;';
        sel.parentNode.insertBefore(nameEl, sel.nextSibling);
      }
      if (nameEl) nameEl.textContent = cur.name || '(unrecognized)';
    } else {
      if (label) label.textContent = 'Viewing as';
      if (sel) sel.style.display = '';
      const roster = STORE.impersonationRoster();
      const imp = STORE.getImpersonation();
      sel.innerHTML = ['<option value="__me__">Me — admin · all activity</option>']
        .concat(roster.map(r => '<option value="' + esc(r.username) + '">' + esc(r.name) + ' · ' + r.role + '</option>')).join('');
      sel.value = imp ? esc(imp) : '__me__';
      if (sel.selectedIndex < 0) sel.value = '__me__';
      sel.onchange = () => {
        const v = sel.value;
        if (v === '__me__') STORE.clearImpersonation(); else STORE.setImpersonation(v);
        render();
      };
    }
    const roleEl = $('#id-role'), noteEl = $('#id-note');
    if (cur.role === 'admin') { roleEl.textContent = 'Admin · all activity'; roleEl.className = 'id-role admin'; }
    else { roleEl.textContent = 'Member · own projects'; roleEl.className = 'id-role member'; }
    noteEl.textContent = cur.impersonating ? 'Previewing ' + (cur.name || 'this person') : '';
  }

  function render() {
    _scoped = null;                    // one read of the trail per render
    buildIdentityBar();
    const rows = filtered();
    buildWhoFilter(rows);

    // KPIs over the scoped set, independent of the filters
    const all = scopedEntries();
    const now = Date.now();
    const since = (d) => all.filter(e => now - new Date(e.ts).getTime() < d * 86400000);
    const week = since(7);
    $('#kpis').innerHTML = [
      { n: since(1).length, l: 'Changes today', c: '' },
      { n: week.length, l: 'Last 7 days', c: 'accent' },
      { n: new Set(week.map(e => e.actor)).size, l: 'People active this week', c: '' },
      { n: new Set(week.filter(e => e.projectId).map(e => e.projectId)).size, l: 'Projects touched', c: 'accent' }
    ].map(k => '<div class="kpi-card ' + k.c + '"><div class="k-num">' + k.n + '</div><div class="k-lbl">' + k.l + '</div></div>').join('');

    const admin = STORE.seesAllProjects(STORE.getCurrentUser());
    const cov = all.length
      ? { entries: all.length, oldest: all[all.length - 1].ts, newest: all[0].ts }
      : { entries: 0, oldest: null, newest: null };
    /* Say what the trail actually holds. The whole reason this went unnoticed
       for so long is that a feed which stops on Monday looks exactly like a
       week in which nothing happened before Monday. */
    $('#scope-note').innerHTML = admin
      ? 'Showing <b>all activity</b> across the system. The trail is kept in full — nothing is discarded — '
        + 'one file per month in Box, and this page loads only the months you ask for. '
        + (cov.entries
          ? '<b>' + cov.entries.toLocaleString() + '</b> entr' + (cov.entries === 1 ? 'y' : 'ies') + ' loaded, '
            + esc(dayLabel(cov.oldest)) + ' → ' + esc(dayLabel(cov.newest)) + '.'
          : 'Nothing loaded yet.')
        + (remoteMonths && remoteMonths.length
          ? ' Box holds <b>' + remoteMonths.length + ' month' + (remoteMonths.length === 1 ? '' : 's') + '</b> ('
            + esc(monthLabel(remoteMonths[0])) + ' → ' + esc(monthLabel(remoteMonths[remoteMonths.length - 1])) + ').'
          : '')
      : 'Showing activity on <b>the projects you can see</b>. Admins see the full system log.';
    renderRecover(admin, cov);

    const feed = $('#feed');
    if (!rows.length) {
      feed.innerHTML = '<div class="empty"><h3>Nothing logged in this window.</h3>'
        + '<p>The log records every project create, edit, status change and deletion — with the fields that changed. '
        + 'Widen the date range, or clear the filters. Entries begin from the first save after logging was switched on.</p></div>';
      return;
    }

    // group by calendar day
    const groups = [];
    const byDay = {};
    rows.forEach(e => {
      const d = new Date(e.ts);
      const key = d.toISOString().slice(0, 10);
      if (!byDay[key]) { byDay[key] = { key, d, rows: [] }; groups.push(byDay[key]); }
      byDay[key].rows.push(e);
    });

    const today = new Date().toISOString().slice(0, 10);
    const yday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    const shown = rows.slice(0, limit);
    const shownSet = new Set(shown);

    feed.innerHTML = groups.map(g => {
      const items = g.rows.filter(e => shownSet.has(e));
      if (!items.length) return '';
      const label = g.key === today ? 'Today' : g.key === yday ? 'Yesterday'
        : g.d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      return '<div class="daygrp"><div class="dayhead"><h2>' + esc(label) + '</h2>'
        + '<span class="dcount">' + items.length + ' change' + (items.length === 1 ? '' : 's') + '</span></div>'
        + items.map(e => {
          const t = new Date(e.ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
          const nm = projName(e), cl = projClient(e);
          const link = e.projectId && STORE.getProject(e.projectId)
            ? '<a class="e-proj" href="Universal Fee Calculator.html?id=' + esc(e.projectId) + '">' + esc(nm) + '</a>'
            : '<span class="e-proj">' + esc(nm) + '</span>';
          return '<div class="ent">'
            + '<div class="e-time">' + esc(t) + '</div>'
            + '<div class="e-who"><b>' + esc(e.actorName || e.actor || 'Unknown') + '</b>'
              + (e.viewingAs ? '<span>while previewing ' + esc(e.viewingAs) + '</span>' : '') + '</div>'
            + '<div class="e-main">'
              + '<div class="e-top"><span class="badge ' + esc(ACTION_KIND(e.action)) + '">' + esc(ACTION_LABEL[e.action] || e.action) + '</span>'
              + link + (cl ? '<span class="e-client">' + esc(cl) + '</span>' : '') + '</div>'
              + '<div class="e-line">' + headline(e) + '</div>'
              + chips(e)
            + '</div></div>';
        }).join('') + '</div>';
    }).join('')
      + (rows.length > limit ? '<div class="more"><button class="btn" id="more">Show more (' + (rows.length - limit) + ' older)</button></div>' : '');

    const mb = document.getElementById('more');
    if (mb) mb.addEventListener('click', () => { limit += 200; render(); });
  }

  function exportCsv() {
    const rows = filtered();
    const head = ['Timestamp', 'Person', 'Email', 'Action', 'Project', 'Client', 'Summary', 'Field', 'From', 'To', 'Net fee from', 'Net fee to'];
    const lines = [head.join(',')];
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    rows.forEach(e => {
      const m = e.meta || {};
      const base = [e.ts, e.actorName || '', e.actor || '', ACTION_LABEL[e.action] || e.action, projName(e), projClient(e),
        headline(e).replace(/<[^>]+>/g, '')];
      const fee = m.fee ? [m.fee.from, m.fee.to] : ['', ''];
      const ch = m.changes || [];
      if (!ch.length) lines.push(base.concat(['', '', ''], fee).map(q).join(','));
      else ch.forEach(c => lines.push(base.concat([c.field, c.from, c.to], fee).map(q).join(',')));
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ppm-change-log-' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function wire() {
    let t;
    $('#search').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { search = e.target.value.trim(); limit = 200; render(); }, 160); });
    $('#f-who').addEventListener('change', e => { who = e.target.value; limit = 200; render(); });
    $('#f-action').addEventListener('change', e => { action = e.target.value; limit = 200; render(); });
    $('#f-range').addEventListener('change', async e => {
      rangeDays = e.target.value ? parseInt(e.target.value, 10) : 0; limit = 200;
      render();                                   // draw what we have straight away
      if (await ensureMonthsLoaded()) render();    // then again with the months just fetched
    });
    $('#csv').addEventListener('click', exportCsv);
  }

  async function boot() {
    wire(); render();
    // Boot pulled the current month; fetch whatever else the opening range wants.
    if (await ensureMonthsLoaded()) render();
  }
  if (window.ufcReady && window.ufcReady.then) { window.ufcReady.then(boot); } else { boot(); }
})();
</script>
<script src="universal-fee-calc/nav.js"></script>
