<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Executive Reporting · Savills PPM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23238291'/><text y='72' x='50' text-anchor='middle' font-size='58' fill='white' font-family='Arial' font-weight='bold'>E</text></svg>">
<link rel="stylesheet" href="exec-reporting/styles.css?v=20260813f">
</head>
<body class="exec-page exec">
  <!-- ============================================================
       EXECUTIVE REPORTING - a read-only module over the four Box
       files the fee system maintains (projects / rates / staff /
       studio). Restricted to the full-admin access list; everyone
       else gets the access panel. Opening the page re-pulls from
       Box, so what renders is live.

       Boots exactly like every other page in this app: the shared
       store, Box adapter, rate catalog, boot.js and nav, then the
       page's own script waiting on window.ufcReady. That gives it
       the house sign-in and error screens, the local-cache schema
       migration, the sync pill and the three-minute background
       refresh, instead of a private copy of any of them.
       ============================================================ -->
  <div id="exec-root" class="wrap"><noscript>Executive Reporting needs JavaScript.</noscript></div>

  <script src="universal-fee-calc/rates-catalog.js?v=20260723g"></script>
  <script src="universal-fee-calc/store.js?v=20260723g"></script>
  <script src="universal-fee-calc/box-adapter.js?v=20260723g"></script>
  <!-- This page reads the budget baselines out of studio.json. Every other
       page in the app used to pull it too and never look at it. -->
  <script>window.UFC_NEEDS = ['studio', 'activity'];</script>
  <script>
    /* DEV ONLY. On localhost with ?dev=fixtures the module renders from local
       copies of the four files so the build can be checked without Box. Turning
       the Box layer off here makes boot.js resolve instantly as "local" instead
       of showing its sign-in screen. Impossible to trigger on a deployed origin,
       and it changes none of the shared files. */
    (function () {
      var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (local && new URLSearchParams(location.search).get('dev') === 'fixtures' && window.UFC_Box) {
        window.UFC_Box.enabled = false;
      }
    })();
  </script>
  <script src="universal-fee-calc/boot.js?v=20260723g"></script>
  <script src="universal-fee-calc/sync-status.js?v=20260723g"></script>
  <script src="universal-fee-calc/nav.js?v=20260723g"></script>
  <!-- The module's own files carry their own version stamp. BUMP THIS on any
       change to core.js, app.js or styles.css, or browsers keep serving the
       old copy after a deploy - the same convention the shared files use. -->
  <script src="exec-reporting/core.js?v=20260813f"></script>
  <script src="exec-reporting/app.js?v=20260813f"></script>
</body>
</html>
