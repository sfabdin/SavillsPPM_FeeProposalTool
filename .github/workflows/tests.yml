name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: HTML hygiene (every page parses cleanly)
        run: node scripts/check-html.mjs
      - name: Regression suite (tests.html)
        run: node scripts/run-tests.mjs
      - name: Executive Reporting model invariants
        run: node exec-reporting/verify-core.mjs
      - name: Client workbook wiring (formulas tie out)
        run: node scripts/check-export.mjs
      - name: Page smoke (every page loads without errors)
        run: node scripts/smoke.mjs
